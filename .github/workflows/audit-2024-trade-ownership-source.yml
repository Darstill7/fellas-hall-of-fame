name: Audit 2020 through 2025 trade ownership and original lineup evidence
on:
  pull_request:
    paths:
      - 'scripts/audit-2024-trade-ownership-source.mjs'
      - 'scripts/research-career-trade-returns.mjs'
      - 'scripts/research-trade-trees.mjs'
      - 'scripts/research-trade-playoff-impact.mjs'
      - 'scripts/research-provider-bracket-identity.mjs'
      - 'scripts/research-boundary-kickoff-evidence.py'
      - 'scripts/research-boundary-adjusted-trade-returns.mjs'
      - 'scripts/research-trade-positional-surplus.mjs'
      - 'scripts/research-trade-model-sensitivity.mjs'
      - 'scripts/research-manager-front-office.mjs'
      - 'scripts/research-manager-trade-matrix.mjs'
      - 'scripts/audit-2025-original-draft-player-ids.mjs'
      - 'scripts/research-2025-draft-peer-returns.mjs'
      - 'scripts/research-career-draft-returns.mjs'
      - '.github/workflows/audit-2024-trade-ownership-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audit syntax
        run: node --check scripts/audit-2024-trade-ownership-source.mjs
      - name: Reconcile original 2024 transactions and starter records
        run: |
          node scripts/audit-2024-trade-ownership-source.mjs
          FELLAS_OWNERSHIP_YEAR=2025 node scripts/audit-2024-trade-ownership-source.mjs
          FELLAS_OWNERSHIP_YEAR=2023 node scripts/audit-2024-trade-ownership-source.mjs
          FELLAS_OWNERSHIP_YEAR=2022 node scripts/audit-2024-trade-ownership-source.mjs
          FELLAS_OWNERSHIP_YEAR=2021 node scripts/audit-2024-trade-ownership-source.mjs
          FELLAS_OWNERSHIP_YEAR=2020 node scripts/audit-2024-trade-ownership-source.mjs
          node --check scripts/research-career-trade-returns.mjs
          node scripts/research-career-trade-returns.mjs
          node --check scripts/research-trade-trees.mjs
          node scripts/research-trade-trees.mjs
          node --check scripts/research-trade-playoff-impact.mjs
          node scripts/research-trade-playoff-impact.mjs
          node --check scripts/research-provider-bracket-identity.mjs
          node scripts/research-provider-bracket-identity.mjs
          python3 scripts/research-boundary-kickoff-evidence.py
          node --check scripts/research-boundary-adjusted-trade-returns.mjs
          node scripts/research-boundary-adjusted-trade-returns.mjs
          node --check scripts/research-trade-positional-surplus.mjs
          node scripts/research-trade-positional-surplus.mjs
          node --check scripts/research-trade-model-sensitivity.mjs
          node scripts/research-trade-model-sensitivity.mjs
          for year in 2020 2021 2022 2023 2024 2025; do
            FELLAS_DRAFT_YEAR=$year node scripts/audit-2025-original-draft-player-ids.mjs
            FELLAS_DRAFT_YEAR=$year node scripts/research-2025-draft-peer-returns.mjs
          done
          node scripts/research-career-draft-returns.mjs
          node --check scripts/research-manager-front-office.mjs
          node scripts/research-manager-front-office.mjs
          node --check scripts/research-manager-trade-matrix.mjs
          node scripts/research-manager-trade-matrix.mjs
      - name: Preserve research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2020-2025-trade-ownership-research
          path: |
            data-integrity/historical-trade-draft-audits/*-ownership-review.json
            data-integrity/historical-trade-draft-audits/career-trade-return-research.json
            data-integrity/historical-trade-draft-audits/trade-tree-research.json
            data-integrity/historical-trade-draft-audits/trade-playoff-impact-research.json
            data-integrity/historical-trade-draft-audits/provider-bracket-identity-research.json
            data-integrity/historical-trade-draft-audits/boundary-kickoff-evidence-research.json
            data-integrity/historical-trade-draft-audits/boundary-adjusted-trade-returns-research.json
            data-integrity/historical-trade-draft-audits/trade-positional-surplus-research.json
            data-integrity/historical-trade-draft-audits/trade-model-sensitivity-research.json
            data-integrity/historical-trade-draft-audits/manager-front-office-research.json
            data-integrity/historical-trade-draft-audits/manager-trade-matrix-research.json
            data-integrity/historical-trade-draft-audits/career-draft-return-research.json
          retention-days: 30
          if-no-files-found: warn
