name: Stage completed Sleeper week for review
on:
  schedule:
    - cron: '30 14 * * 3'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  stage-sleeper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check staging script syntax
        run: node --check scripts/stage-sleeper-week.mjs
      - name: Stage complete next week (skip expected not-yet-final cases)
        id: stage
        run: |
          if node scripts/stage-sleeper-week.mjs > /tmp/sleeper-stage.log 2>&1; then
            cat /tmp/sleeper-stage.log
          else
            cat /tmp/sleeper-stage.log
            if grep -q 'has not been superseded by the next NFL week' /tmp/sleeper-stage.log; then
              echo 'NFL week not finished; no update' >> "$GITHUB_STEP_SUMMARY"
            else
              exit 1
            fi
          fi
      - name: Create review pull request, never update canonical history automatically
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'Stage verified-coverage Sleeper weekly matchups for human review'
          branch: 'automation/sleeper-weekly-stage'
          delete-branch: true
          title: 'Review next Sleeper week before canonical ratings refresh'
          body: |
            Automated staging candidate ONLY. **Do not merge this PR as canonical history.** After human review, run the approved importer with FELLAS_APPROVE_WEEKLY_IMPORT=YES and commit all regenerated projections together, then verify full CI. Verify all team identities and five finalized score pairs against Sleeper. Check all generated data and site-wide stale projections; repair additional consumers if CI flags them. The public Madden card recalculates upon approved deployment.
          add-paths: |
            data-integrity/sleeper-sync-candidates/*.json
            data/unified_record_book_2016_2026.json
            data/season_weekly_matchups_2016_2026_v1.json
            data/all_time_luck_ratings_v1.json
            data/career_core_generated.json
            data/season_guide.json
            seasons/index.html
