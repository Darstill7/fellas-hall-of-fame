name: Manager Franchise Timeline 4.3 verification
on:
  pull_request:
    paths:
      - 'assets/manager-franchise-timeline-v43.*'
      - 'scripts/test-manager-franchise-timeline-v43.mjs'
      - '.github/workflows/manager-franchise-timeline-v43.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-manager-franchise-timeline-v43.mjs
