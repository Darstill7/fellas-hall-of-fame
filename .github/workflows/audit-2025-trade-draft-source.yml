name: Audit 2025 completed trades and draft starter attribution
on:
  pull_request:
    paths:
      - 'scripts/audit-2025-trade-draft-source.mjs'
      - '.github/workflows/audit-2025-trade-draft-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source audit script
        run: node --check scripts/audit-2025-trade-draft-source.mjs
      - name: Recalculate original Sleeper transaction ID and 2025 starter points
        run: node scripts/audit-2025-trade-draft-source.mjs
      - name: Upload complete source discrepancy report, never publish
        uses: actions/upload-artifact@v4
        with:
          name: 2025-trade-draft-research-only-audit
          retention-days: 30
          path: data-integrity/historical-trade-draft-audits/2025-original-sleeper-review.json
