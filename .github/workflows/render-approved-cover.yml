name: Render approved cover for social sharing
on:
  push:
    branches:
      - feature/weekly-shitter-approved-toilet-throne-cover
    paths:
      - 'shitter/cover-week10-approved.avif'
      - '.github/workflows/render-approved-cover.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow pillow-avif-plugin
      - name: Produce full-width JPEG from approved throne artwork
        run: |
          python - <<'PY'
          from PIL import Image
          import pillow_avif
          from pathlib import Path
          image=Image.open("shitter/cover-week10-approved.avif").convert("RGB")
          image.resize((1200,630),Image.Resampling.LANCZOS).save("shitter/cover-week10-approved.jpg",quality=89,optimize=True,progressive=True)
          assert Path("shitter/cover-week10-approved.jpg").stat().st_size>10000
          PY
      - name: Commit new social-preview image
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add shitter/cover-week10-approved.jpg
          if ! git diff --cached --quiet; then
            git commit -m "art: generate JPEG preview for approved toilet throne"
            git push
          fi
