name: Scan website freshness registry
on:
  schedule:
    - cron: '0 18 * * 2'
    - cron: '0 18 * * 3'
  pull_request:
    paths:
      - 'data/site_freshness_config_v1.json'
      - 'data/site_freshness_report_v1.json'
      - 'scripts/scan-site-freshness.mjs'
      - 'scripts/apply-reviewed-sleeper-week.mjs'
      - '.github/workflows/scan-site-freshness.yml'
      - 'analytics/site-freshness.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan 2026 data coverage and last Git file change
        run: |
          set -euo pipefail
          node --check scripts/scan-site-freshness.mjs
          node scripts/scan-site-freshness.mjs --markdown
          node scripts/scan-site-freshness.mjs --json > /tmp/fellas-freshness.json
          node scripts/scan-site-freshness.mjs --strict
      - name: Archive structured scan for machines and future reviews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fellas-website-freshness-scan
          path: /tmp/fellas-freshness.json
          if-no-files-found: warn
          retention-days: 30
