name: Record Book certification audit
on:
  pull_request:
    paths:
      - 'scripts/audit-record-certification.mjs'
      - 'scripts/build-certified-record-watch.mjs'
      - 'scripts/test-certified-record-watch.mjs'
      - 'scripts/test-record-watch-integrations.mjs'
      - 'assets/certified-record-watch-feed.mjs'
      - 'data/certified-record-watch-feed-v1.json'
      - 'assets/home-app-v3.mjs'
      - 'assets/manager-achievements-record-watch.mjs'
      - 'analytics/records.html'
      - 'analytics/playoff-race.html'
      - 'scripts/build-weekly-editorial-packet.mjs'
      - 'scripts/build-weekly-shitter-research.mjs'
      - 'scripts/verify-legendary-records.mjs'
      - 'scripts/simulate-week14-stage-migration.mjs'
      - 'data/week14_2020_2021_stage_classification_audit_v1.json'
      - 'data/corrected_2020_2021_regular_standings_projection_v1.json'
      - 'scripts/verify-historical-matchup-sources.mjs'
      - 'data/espn_history_2016_2019.json'
      - 'data/sleeper_matchups_*.json'
      - 'scripts/build-record-book-phase2.mjs'
      - 'scripts/build-record-taxonomy-crosswalk.mjs'
      - 'data/unified_record_book_2016_2026.json'
      - '.github/workflows/record-certification-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-historical-matchup-sources.mjs > historical-source-parity.json
      - run: node scripts/simulate-week14-stage-migration.mjs > historical-migration-impact.json
      - run: node scripts/verify-record-taxonomy-crosswalk.mjs
      - run: node scripts/verify-record-book-phase2.mjs
      - run: node scripts/audit-record-certification.mjs > record-certification-audit.json
      - run: node scripts/test-certified-record-watch.mjs
      - run: node scripts/test-record-watch-integrations.mjs
      - run: node scripts/build-certified-record-watch.mjs > certified-record-watch-research.json
      - uses: actions/upload-artifact@v4
        with:
          name: record-certification-audit
          path: |
            record-certification-audit.json
            historical-source-parity.json
            historical-migration-impact.json
            certified-record-watch-research.json
