name: One-time Week 9 reviewed import on staging branch
on:
  push:
    branches:
      - sync/2026-week9-review-20261110
    paths:
      - '.github/workflows/2026-week9-reviewed-import.yml'
permissions:
  contents: write
jobs:
  import-reviewed-week:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staged source and review approval boundary
        run: |
          node -e "const c=require('./data-integrity/sleeper-sync-candidates/2026-week9.json');if(c.status!=='REVIEW_REQUIRED'||c.week!==9||c.games.length!==5||new Set(c.games.flatMap(g=>[g.home,g.away])).size!==10)process.exit(1)"
          node scripts/apply-reviewed-sleeper-week.mjs data-integrity/sleeper-sync-candidates/2026-week9.json --dry-run
        env:
          FELLAS_APPROVE_WEEKLY_IMPORT: 'YES'
      - name: Import Week 9 and regenerate core website projections
        run: node scripts/apply-reviewed-sleeper-week.mjs data-integrity/sleeper-sync-candidates/2026-week9.json
        env:
          FELLAS_APPROVE_WEEKLY_IMPORT: 'YES'
      - name: Verify cross-page week freshness
        run: |
          node scripts/verify-current-week-website.mjs
          node scripts/verify-weekly-ledger-parity.mjs
          node scripts/test-playoff-race-archive.mjs
      - name: Commit only generated outputs to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/unified_record_book_2016_2026.json data/season_weekly_matchups_2016_2026_v1.json data/all_time_luck_ratings_v1.json data/career_core_generated.json data/season_guide.json data/playoff_race_v1.json seasons/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Import approved final Week 9 and regenerate canonical season projections"
            git push origin HEAD:sync/2026-week9-review-20261110
          fi
