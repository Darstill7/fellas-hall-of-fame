name: Verify rivalry recent context
on:
  pull_request:
    paths:
      - 'assets/rivalry-archive-v3.js'
      - 'data/unified_record_book_2016_2026.json'
      - 'data/playoff_explorer_verified_2016_2025_v1.json'
      - 'scripts/verify-rivalry-recent-context.mjs'
      - '.github/workflows/verify-rivalry-recent-context.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/rivalry-archive-v3.js
      - run: node scripts/verify-rivalry-recent-context.mjs
