name: Verify manager career snapshots
on:
  pull_request:
    paths:
      - 'assets/manager-career-snapshot.mjs'
      - 'assets/manager-front-office.mjs'
      - 'assets/manager-defining-moves.mjs'
      - 'scripts/test-manager-defining-moves.mjs'
      - 'data/manager_franchise_enrichment_v1.json'
      - 'data/featured_trade_storylines_v1.json'
      - 'scripts/test-manager-front-office.mjs'
      - 'data/manager_draft_trade_profile_evidence_v1.json'
      - 'data/manager_acquisition_by_season_v1.json'
      - 'data/trade_museum_stage66.json'
      - 'assets/manager-career-snapshot.css'
      - 'scripts/test-manager-career-snapshot.mjs'
      - 'managers/**/index.html'
      - 'data/unified_record_book_2016_2026.json'
      - '.github/workflows/verify-manager-career-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manager-snapshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/manager-career-snapshot.mjs
      - run: node --check scripts/test-manager-career-snapshot.mjs
      - run: node scripts/test-manager-career-snapshot.mjs
      - run: node --check assets/manager-front-office.mjs
      - run: node --check scripts/test-manager-front-office.mjs
      - run: node scripts/test-manager-front-office.mjs
      - run: node --check assets/manager-defining-moves.mjs
      - run: node --check scripts/test-manager-defining-moves.mjs
      - run: node scripts/test-manager-defining-moves.mjs
