name: Production homepage rehearsal
on:
  pull_request:
    paths:
      - 'index.html'
      - 'home-classic.html'
      - 'assets/app-shell-v34.*'
      - 'assets/home-app-v3.*'
      - 'fellas-app.webmanifest'
      - 'scripts/test-production-homepage-browser.mjs'
      - '.github/workflows/production-homepage-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-production-homepage-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-homepage-rehearsal
          path: data-integrity/production-rehearsal/
