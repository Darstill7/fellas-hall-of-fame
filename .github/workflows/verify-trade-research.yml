name: Verify researched trade outcomes
on:
  push:
    paths:
      - 'data/greatest_worst_trades_research_v1.json'
      - 'data/championship_trade_impact_receipts_2020_2025_v1.json'
      - 'assets/record-holders-page.mjs'
      - 'analytics/records.html'
      - 'analytics/record-holders.html'
      - 'data/championship_trade_awards_2020_2025_v1.json'
      - 'scripts/verify-playoff-trade-revenge.mjs'
      - 'data/season_weekly_matchups_2016_2026_v1.json'
      - 'data/playoff_trade_revenge_2020_2025_v1.json'
      - 'scripts/build-expanded-playoff-trade-revenge.mjs'
      - 'scripts/verify-2022-playoff-trade-reunion.mjs'
      - 'data/playoff_explorer_verified_2016_2025_v1.json'
      - 'data/expanded_playoff_trade_revenge_2020_2025_v1.json'
      - 'scripts/verify-recovered-playoff-brackets.mjs'
      - 'data/recovered_playoff_bracket_canonical_reconciliation_v1.json'
      - 'data/recovered_winners_bracket_2020_2021_v1.json'
      - 'data/sleeper_2022_w15_mitch_stilly_trade_reunion_v1.json'
      - 'scripts/verify-tony-2021-championship-trades.mjs'
      - 'analytics/tony-2021-four-trades-one-ring.html'
      - 'data/tony_2021_championship_trade_case_study_v1.json'
      - 'data/championship_player_boxscores_2020_2025_v1.json'
      - 'data/verified_sleeper_playoff_brackets_2020_2025.json'
      - 'data/multiteam_keeper_trade_case_studies_v1.json'
      - 'data/trade_winners_losers_research_2020_2025_v1.json'
      - 'data/trade_par_preview.json'
      - 'data/trade_museum_stage66.json'
      - 'data/trade_lineage_v2.json'
      - 'analytics/greatest-worst-trades.html'
      - 'analytics/trades.html'
      - 'hall/shame.html'
      - 'scripts/verify-greatest-worst-trades.mjs'
      - 'scripts/verify-championship-trade-impact.mjs'
      - '.github/workflows/verify-trade-research.yml'
  pull_request:
    paths:
      - 'data/greatest_worst_trades_research_v1.json'
      - 'data/championship_trade_impact_receipts_2020_2025_v1.json'
      - 'assets/record-holders-page.mjs'
      - 'analytics/records.html'
      - 'analytics/record-holders.html'
      - 'data/championship_trade_awards_2020_2025_v1.json'
      - 'scripts/verify-playoff-trade-revenge.mjs'
      - 'data/season_weekly_matchups_2016_2026_v1.json'
      - 'data/playoff_trade_revenge_2020_2025_v1.json'
      - 'scripts/build-expanded-playoff-trade-revenge.mjs'
      - 'scripts/verify-2022-playoff-trade-reunion.mjs'
      - 'data/playoff_explorer_verified_2016_2025_v1.json'
      - 'data/expanded_playoff_trade_revenge_2020_2025_v1.json'
      - 'scripts/verify-recovered-playoff-brackets.mjs'
      - 'data/recovered_playoff_bracket_canonical_reconciliation_v1.json'
      - 'data/recovered_winners_bracket_2020_2021_v1.json'
      - 'data/sleeper_2022_w15_mitch_stilly_trade_reunion_v1.json'
      - 'scripts/verify-tony-2021-championship-trades.mjs'
      - 'analytics/tony-2021-four-trades-one-ring.html'
      - 'data/tony_2021_championship_trade_case_study_v1.json'
      - 'data/championship_player_boxscores_2020_2025_v1.json'
      - 'data/verified_sleeper_playoff_brackets_2020_2025.json'
      - 'data/multiteam_keeper_trade_case_studies_v1.json'
      - 'data/trade_par_preview.json'
      - 'data/trade_museum_stage66.json'
      - 'data/trade_lineage_v2.json'
      - 'analytics/greatest-worst-trades.html'
      - 'scripts/verify-greatest-worst-trades.mjs'
      - 'scripts/verify-championship-trade-impact.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-trade-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research test syntax
        run: |
          node --check scripts/verify-greatest-worst-trades.mjs
          node --check scripts/verify-championship-trade-impact.mjs
          node --check scripts/verify-tony-2021-championship-trades.mjs
          node --check scripts/verify-playoff-trade-revenge.mjs
          node --check scripts/build-expanded-playoff-trade-revenge.mjs
          node --check scripts/verify-2022-playoff-trade-reunion.mjs
          node --check scripts/verify-recovered-playoff-brackets.mjs
      - name: Verify verified trades, multi-team lineage and championship caveats
        run: |
          node scripts/verify-greatest-worst-trades.mjs
          node scripts/verify-championship-trade-impact.mjs
          node scripts/verify-tony-2021-championship-trades.mjs
          node scripts/verify-playoff-trade-revenge.mjs
          node scripts/build-expanded-playoff-trade-revenge.mjs --check
          node scripts/verify-2022-playoff-trade-reunion.mjs
          node scripts/verify-recovered-playoff-brackets.mjs
