name: Verify historical season collapses
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-historic-collapse-records.mjs'
      - 'scripts/verify-historic-collapse-records.mjs'
      - 'data/season_weekly_matchups_2016_2026_v1.json'
      - 'data/postseason_records_verified_v1.json'
      - 'data/fellas_final_placements_2016_2025_verified.json'
      - '.github/workflows/research-historic-collapses.yml'
  workflow_dispatch:
jobs:
  collapse-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 98 completed seasons and 11 proposed records
        run: node scripts/verify-historic-collapse-records.mjs
