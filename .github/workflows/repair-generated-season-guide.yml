name: Repair generated season-guide projections
on:
  push:
    paths:
      - '.github/workflows/repair-generated-season-guide.yml'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/generate-season-guide.mjs
          node scripts/generate-season-guide.mjs --check
      - name: Commit deterministic regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season_guide.json seasons/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate season guide and embedded season page from canonical records"
            git push origin HEAD:main
          fi
