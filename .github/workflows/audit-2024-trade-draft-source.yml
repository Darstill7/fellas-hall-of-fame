name: Audit 2024 completed trades and draft starter attribution
on:
  pull_request:
    paths:
      - 'scripts/audit-2024-trade-draft-source.mjs'
      - '.github/workflows/audit-2024-trade-draft-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archived 2024 trades with original Sleeper additions and final starter PF
        run: |
          node --check scripts/audit-2024-trade-draft-source.mjs
          node scripts/audit-2024-trade-draft-source.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: 2024-original-trade-draft-research-only
          retention-days: 30
          path: data-integrity/historical-trade-draft-audits/2024-original-sleeper-review.json
