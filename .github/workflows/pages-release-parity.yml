name: Verify deployed GitHub Pages parity
on:
  pull_request:
    paths:
      - 'scripts/verify-pages-release-parity.mjs'
      - 'scripts/test-pages-release-parity.mjs'
      - '.github/workflows/pages-release-parity.yml'
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - 'pages build and deployment'
    types:
      - completed
  workflow_dispatch:
jobs:
  parity-unit-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/verify-pages-release-parity.mjs
          node scripts/test-pages-release-parity.mjs

  deployed-pages-byte-parity:
    if: >-
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout the exact main commit for published-byte verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name != 'workflow_run' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test permanent mismatch and retry behavior
        run: node scripts/test-pages-release-parity.mjs
      - name: Detect and skip superseded main commits
        id: main_head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}"
          current="$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/main | cut -f1)"
          if [[ ! "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Could not resolve canonical main SHA' >&2
            exit 1
          fi
          if [[ "$current" != "$expected" ]]; then
            echo "Superseded commit $expected; latest main is $current. The newer run should verify the current site."
            echo 'is_current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'is_current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify deployed asset byte parity — fail on persistent mismatch
        if: steps.main_head.outputs.is_current == 'true'
        env:
          PAGES_DEPLOY_SHA: ${{ github.event_name == 'push' && github.sha || github.event.workflow_run.head_sha }}
          PAGES_BASE_URL: https://darstill7.github.io/fellas-hall-of-fame/
        run: node scripts/verify-pages-release-parity.mjs
