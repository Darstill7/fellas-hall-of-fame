name: Record unification research 5.2
on:
  pull_request:
    paths:
      - 'scripts/build-*record*-v52.mjs'
      - 'scripts/build-positional-record-pilot-v53.mjs'
      - 'scripts/build-champion-position-records-v53.mjs'
      - 'scripts/build-team-scoring-records-v53.mjs'
      - 'scripts/build-front-office-records-v54.mjs'
      - 'scripts/build-waiver-records-v54.mjs'
      - 'scripts/build-keeper-records-v54.mjs'
      - 'scripts/build-transaction-records-v54.mjs'
      - 'scripts/build-championship-acquisition-records-v54.mjs'
      - 'scripts/build-lineup-records-v55.mjs'
      - 'scripts/build-schedule-luck-records-v55.mjs'
      - 'scripts/build-player-hall-of-fame-v56.mjs'
      - 'scripts/build-player-championship-records-v56.mjs'
      - 'scripts/build-player-transaction-history-v56.mjs'
      - 'scripts/build-player-directory-v56.mjs'
      - 'scripts/build-unified-record-registry-v57.mjs'
      - 'analytics/player-directory-preview.html'
      - 'assets/player-directory-preview.mjs'
      - 'assets/manager-record-ownership.mjs'
      - 'data/**'
      - '.github/workflows/record-unification-v52.yml'
  workflow_dispatch:
jobs:
  record-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inventory source definitions
        run: node scripts/build-record-inventory-v52.mjs
      - name: Recompute current regular-season core
        run: node scripts/build-canonical-record-core-v52.mjs
      - name: Recompute and verify completed record candidates
        run: node scripts/build-canonical-record-completed-v52.mjs
      - name: Audit recovered positional starter records
        run: node scripts/build-positional-record-pilot-v53.mjs
      - name: Verify champion positional record receipts
        run: node scripts/build-champion-position-records-v53.mjs
      - name: Recompute team scoring and consistency records
        run: node scripts/build-team-scoring-records-v53.mjs
      - name: Reconcile front-office record research
        run: node scripts/build-front-office-records-v54.mjs
      - name: Reconcile waiver and FAAB record research
        run: node scripts/build-waiver-records-v54.mjs
      - name: Reconcile keeper record research
        run: node scripts/build-keeper-records-v54.mjs
      - name: Reconcile transaction activity records
        run: node scripts/build-transaction-records-v54.mjs
      - name: Reconcile championship acquisition records
        run: node scripts/build-championship-acquisition-records-v54.mjs
      - name: Reconcile hindsight lineup records
        run: node scripts/build-lineup-records-v55.mjs
      - name: Reconcile schedule luck records
        run: node scripts/build-schedule-luck-records-v55.mjs
      - name: Reconcile player Hall of Fame
        run: node scripts/build-player-hall-of-fame-v56.mjs
      - name: Reconcile player championship records
        run: node scripts/build-player-championship-records-v56.mjs
      - name: Reconcile player transaction history
        run: node scripts/build-player-transaction-history-v56.mjs
      - name: Generate player directory preview
        run: |
          node scripts/build-player-directory-v56.mjs
          node --check assets/player-directory-preview.mjs
      - name: Normalize unified record registry
        run: node scripts/build-unified-record-registry-v57.mjs
      - name: Upload candidate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-unification-research
          path: |
            data-integrity/*record*-v52.json
            data-integrity/positional-record-pilot-v53.json
            data-integrity/champion-position-records-v53.json
            data-integrity/team-scoring-records-v53.json
            data-integrity/front-office-records-v54.json
            data-integrity/waiver-records-v54.json
            data-integrity/keeper-records-v54.json
            data-integrity/transaction-records-v54.json
            data-integrity/championship-acquisition-records-v54.json
            data-integrity/lineup-records-v55.json
            data-integrity/schedule-luck-records-v55.json
            data-integrity/player-hall-of-fame-v56.json
            data-integrity/player-championship-records-v56.json
            data-integrity/player-transaction-history-v56.json
            data-integrity/player-directory-preview/
            data-integrity/unified-record-registry-v57.json
          if-no-files-found: error
