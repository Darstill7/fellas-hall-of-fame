name: Prepare approved weekly website release
on:
  workflow_dispatch:
    inputs:
      completed_week:
        description: 'The independently reviewed final 2026 NFL week (1-14)'
        required: true
        type: string
      confirmation:
        description: 'Type APPROVE to confirm all 5 matchups and 10 manager identities were checked in Sleeper'
        required: true
        type: string
      staging_commit:
        description: 'Full 40-character SHA of the exact staging PR version independently reviewed'
        required: true
        type: string
      publication_scope:
        description: 'Matchup refresh with labeled source limits, or require all weekly evidence'
        type: choice
        default: matchups
        options:
          - matchups
          - all_collections
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: fellas-approved-weekly-release
  cancel-in-progress: false
jobs:
  prepare:
    if: ${{ inputs.confirmation == 'APPROVE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed week and retrieve fixed-source staging candidate
        env:
          REVIEWED_WEEK: ${{ inputs.completed_week }}
          REVIEWED_STAGING_COMMIT: ${{ inputs.staging_commit }}
        run: |
          set -euo pipefail
          if ! [[ "$REVIEWED_WEEK" =~ ^([1-9]|1[0-4])$ ]]; then
            echo "::error::Completed week must be a 2026 regular-season week from 1 to 14"
            exit 1
          fi
          if ! [[ "$REVIEWED_STAGING_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Enter the exact full 40-character SHA from the commissioner-reviewed staging PR"
            exit 1
          fi
          git fetch origin refs/heads/automation/sleeper-weekly-stage:refs/remotes/origin/automation/sleeper-weekly-stage
          SOURCE_COMMIT=$(git rev-parse refs/remotes/origin/automation/sleeper-weekly-stage)
          if [[ "$SOURCE_COMMIT" != "$REVIEWED_STAGING_COMMIT" ]]; then
            echo "::error::Staging branch changed after approval. Re-review the new staging PR head and run with its exact SHA."
            echo "Reviewed SHA: $REVIEWED_STAGING_COMMIT; latest staging SHA: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Candidate staging commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "STAGING_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          CANDIDATE="data-integrity/sleeper-sync-candidates/2026-week${REVIEWED_WEEK}.json"
          mkdir -p data-integrity/sleeper-sync-candidates
          git show "$SOURCE_COMMIT:${CANDIDATE}" > "$CANDIDATE"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1]));if(x.source!=='Sleeper public API'||x.games?.some(g=>g.source!=='sleeper_api_staged_week_'+x.week)||x.year!==2026||x.week!==Number(process.argv[2])||x.status!=='REVIEW_REQUIRED'||x.matchupCount!==5||x.games?.length!==5)process.exit(1)" "$CANDIDATE" "$REVIEWED_WEEK"
          echo "CANDIDATE=$CANDIDATE" >> "$GITHUB_ENV"
          echo "REVIEWED_WEEK=$REVIEWED_WEEK" >> "$GITHUB_ENV"
      - name: Recalculate approved games, standings, playoff odds, luck and 2026 records
        env:
          FELLAS_APPROVE_WEEKLY_IMPORT: 'YES'
          PUBLICATION_SCOPE: ${{ inputs.publication_scope }}
        run: bash scripts/refresh-approved-week-v58.sh
      - name: Retain source audit and scoped research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-source-and-editorial-evidence
          path: |
            ${{ runner.temp }}/fellas-freshness/
            ${{ runner.temp }}/fellas-editorial/
            data-integrity/player-directory-preview/
          if-no-files-found: ignore
      - name: Build one reviewable weekly release PR; never merge automatically
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/approved-2026-weekly
          delete-branch: false
          commit-message: 'Refresh approved 2026 league projections through Week ${{ inputs.completed_week }}'
          title: 'Publish reviewed 2026 Week ${{ inputs.completed_week }} standings, odds and current-season records'
          body: |
            Explicitly reviewed source SHA and contiguous approved week.
            Canonical and consumer checks must pass before merging.
            Publication scope: ${{ inputs.publication_scope }}. See the freshness audit for the verified cutoff of each collection.
            Trade and other receipts remain separately reviewed; no automated publication.
          add-paths: |
            data/*.json
            index.html
            analytics/*.html
            seasons/*.html
            managers/**/*.html
            managers/*.html
      - name: Summarize release handoff
        run: |
          echo 'Generated a reviewable weekly publication PR. No live website merge or GitHub Pages deployment was initiated by this workflow.' >> "$GITHUB_STEP_SUMMARY"
