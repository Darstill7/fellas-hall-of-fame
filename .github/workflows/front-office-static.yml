name: Front Office offline source checks
on:
  pull_request:
    paths:
      - 'data-integrity/*-preview.html'
      - 'scripts/test-front-office-static.mjs'
      - '.github/workflows/front-office-static.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-front-office-static.mjs
