name: Manager Rivalry Intelligence 4.4 verification
on:
  pull_request:
    paths:
      - 'assets/manager-rivalry-intelligence-v44.*'
      - 'scripts/test-manager-rivalry-intelligence-v44*.mjs'
      - '.github/workflows/manager-rivalry-intelligence-v44.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-manager-rivalry-intelligence-v44.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node scripts/test-manager-rivalry-intelligence-v44-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-rivalry-v44-browser-evidence
          path: data-integrity/manager-rivalry-v44/
