name: Verify 2024 original drafted player IDs and starter PF
on:
  pull_request:
    paths:
      - 'scripts/audit-2024-original-draft-player-ids.mjs'
      - 'scripts/research-2024-draft-peer-returns.mjs'
      - '.github/workflows/audit-2024-original-draft-ids.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft-id-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 2024 draft player ID and comparative return evidence
        run: |
          node --check scripts/audit-2024-original-draft-player-ids.mjs
          node scripts/audit-2024-original-draft-player-ids.mjs
          node --check scripts/research-2024-draft-peer-returns.mjs
          node scripts/research-2024-draft-peer-returns.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: 2024-draft-source-and-research-only-peer-returns
          retention-days: 30
          path: |
            data-integrity/historical-trade-draft-audits/2024-sleeper-draft-id-review.json
            data-integrity/historical-trade-draft-audits/2024-draft-peer-return-research.json
