name: Visual first-screen quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: fellas-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-first-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser engines
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify manager portfolio is above expanded records lab
        run: node scripts/verify-manager-portfolio-first.mjs
      - name: Validate eleven-season editorial archive and shareable history links
        run: node scripts/verify-season-editorial-history.mjs
      - name: Verify homepage editorial cover and manager finder
        run: node scripts/verify-homepage-editorial.mjs
      - name: Validate current season and 2020–2025 editorial editions
        run: node scripts/verify-season-editions-phase2.mjs
      - name: Validate key visitor navigation and keyboard skip routes
        run: node scripts/verify-primary-journey-links.mjs
      - name: Verify Player Hall and Hall of Shame museum editions
        run: node scripts/verify-museum-editorial-editions.mjs
      - name: Verify championship-backed Player Hall plaques and editorial rating labels
        run: node scripts/verify-player-plaque-receipts.mjs
      - name: Verify ten historical Shitter trophy-case receipts
        run: node scripts/verify-shitter-trophy-case.mjs
      - name: Verify archived metrics context and current navigation
        run: node scripts/verify-archived-metrics-navigation.mjs
      - name: Capture desktop, tablet, phone and Safari first screens
        run: node scripts/visual-quality-gate.mjs
      - name: Publish visual audit and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fellas-visual-quality-gate
          path: data-integrity/visual-gate/
          if-no-files-found: warn
          retention-days: 14
      - name: Visual audit summary
        if: always()
        run: |
          if [ -f data-integrity/visual-gate/report.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const r=JSON.parse(fs.readFileSync("data-integrity/visual-gate/report.json","utf8"));
              console.log("Visual check:",r.observed,"/",r.planned,"screens; findings:",r.findings.length);
              for(const finding of r.findings)console.log("- "+finding);
            '
          fi
