name: Validate canonical Fellas records
on:
  push:
    branches: [main]
  pull_request:
jobs:
  canonical-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify records across published pages
        run: node scripts/verify-canonical-history.mjs
