name: Validate canonical Fellas records
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data-integrity/WORKFLOW_HANDOFF_2026-10-27.md'
  pull_request:
  workflow_dispatch:
concurrency:
  group: canonical-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canonical-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check audit and generation scripts
        run: |
          for file in scripts/generate-season-guide.mjs scripts/generate-career-core.mjs scripts/verify-ledger-projections.mjs scripts/verify-core-consumers.mjs scripts/verify-canonical-history.mjs scripts/audit-internal-links.mjs scripts/smoke-static-site.mjs scripts/audit-site-dependencies.mjs scripts/verify-specialty-records.mjs scripts/test-browser-release.mjs scripts/audit-inline-js.mjs scripts/audit-dossier-preservation.mjs scripts/audit-dossier-editorial-inventory.mjs scripts/audit-dossier-topic-overlap.mjs scripts/verify-dossier-award-sources.mjs scripts/verify-biography-season-claims.mjs scripts/verify-biography-trade-claims.mjs scripts/verify-biography-editorial-parity.mjs scripts/verify-fellas-rating.mjs scripts/verify-manager-report-cards.mjs scripts/verify-unresolved-trade-evidence.mjs scripts/verify-trade-source-manifest.mjs scripts/verify-faab-aggregates.mjs scripts/verify-faab-provider-receipts.mjs scripts/analyze-faab-acquisition-value.mjs scripts/summarize-faab-observed-value.mjs scripts/analyze-faab-bench-opportunity.mjs scripts/verify-faab-outcomes.mjs scripts/attribute-faab-managers.mjs scripts/summarize-faab-managers.mjs scripts/analyze-faab-opposing-bench-baseline.mjs scripts/verify-faab-positional-baseline.mjs scripts/analyze-faab-cost-normalized.mjs scripts/verify-faab-cost-normalized.mjs; do
            node --check "$file"
          done
      - name: Syntax-check all shipped JavaScript assets
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
      - name: Syntax-check HTML inline JavaScript
        run: node scripts/audit-inline-js.mjs
      - name: Inventory all site data dependencies (advisory)
        run: node scripts/audit-site-dependencies.mjs
      - name: Enforce valid internal links
        run: node scripts/audit-internal-links.mjs --strict
      - name: Publish link-audit summary
        if: always()
        run: |
          if [ -f data-integrity/internal-link-audit.json ]; then
            node -e "const d=require('./data-integrity/internal-link-audit.json'); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '### Internal link audit\\n\\nScanned '+d.pagesScanned+' HTML pages; '+d.unresolvedLocalLinks+' unresolved local references.\\n')"
          fi
      - name: Smoke-test GitHub Pages routes and manager profile assets
        run: node scripts/smoke-static-site.mjs
      - name: Verify generated career and H2H data
        run: node scripts/generate-career-core.mjs --check
      - name: Verify historical season guide output
        run: node scripts/generate-season-guide.mjs --check
      - name: Reconcile source ledger to projections
        run: node scripts/verify-ledger-projections.mjs
      - name: Verify canonical website consumers
        run: node scripts/verify-core-consumers.mjs
      - name: Inventory unmatched historical dossier editorial headings
        run: node scripts/audit-dossier-editorial-inventory.mjs > data-integrity/dossier-editorial-inventory.json
      - name: Classify dossier topical overlap
        run: node scripts/audit-dossier-topic-overlap.mjs > data-integrity/dossier-topic-overlap.json
      - name: Upload link-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-audit
          path: |
            data-integrity/internal-link-audit.json
            data-integrity/site-dependency-inventory.json
            data-integrity/dossier-editorial-inventory.json
            data-integrity/dossier-topic-overlap.json
          if-no-files-found: ignore
      - name: Reconcile scored trade sides to archived source manifest
        run: node scripts/verify-trade-source-manifest.mjs
      - name: Protect unresolved trade classifications
        run: node scripts/verify-unresolved-trade-evidence.mjs
      - name: Verify dossier trade and waiver awards against archived source models
        run: node scripts/verify-dossier-award-sources.mjs
      - name: Verify documented biography season and championship claims
        run: node scripts/verify-biography-season-claims.mjs
      - name: Verify biography trade claims against archived sides
        run: node scripts/verify-biography-trade-claims.mjs
      - name: Keep archived biography copy in sync with manager profiles
        run: node scripts/verify-biography-editorial-parity.mjs
      - name: Preserve historical manager dossier coverage
        run: node scripts/audit-dossier-preservation.mjs
      - name: Reconcile specialty record-book statistics to canonical ledger
        run: node scripts/verify-specialty-records.mjs
      - name: Verify records across published pages
        run: node scripts/verify-canonical-history.mjs
      - name: Observe deployed GitHub Pages parity (deployment may lag CI)
        continue-on-error: true
        run: |
          set -euo pipefail
          for file in index.html managers/stilly/index.html managers/tom/index.html managers/stover/index.html data/career_core_generated.json data/manager_biographies_awards.json assets/manager-encyclopedia.js; do
            url="https://darstill7.github.io/fellas-hall-of-fame/$file"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 --silent --show-error "$url" -o /tmp/fellas-public-file
            cmp -s "$file" /tmp/fellas-public-file || { echo "::error::Published file differs from checkout: $file"; exit 1; }
            echo "Published file matches: $file"
          done
      - name: Verify living Fellas power rating formula
        run: node scripts/verify-fellas-rating.mjs
      - name: Syntax-check Madden manager browser modules
        run: |
          node --check scripts/stage-sleeper-week.mjs
          node --check scripts/apply-reviewed-sleeper-week.mjs
          node --check scripts/test-weekly-import-rehearsal.mjs
          node --check assets/home-manager-cards.mjs
          node --check assets/manager-madden-scale.mjs
          node --check scripts/verify-manager-madden-scale.mjs
          node --check assets/manager-historical-ovr.mjs
          node --check scripts/verify-historical-ovr.mjs
          node --check assets/manager-profile-madden.mjs
          node --check assets/manager-madden-cards.mjs
          node --check assets/manager-madden-archetypes.mjs
          node --check assets/manager-weekly-ovr.mjs
      - name: Rehearse synthetic weekly import without canonical mutations
        run: node scripts/test-weekly-import-rehearsal.mjs
      - name: Verify Madden OVR calibration across cards and profiles
        run: node scripts/verify-manager-madden-scale.mjs
      - name: Verify historical OVR without future-season leakage
        run: node scripts/verify-historical-ovr.mjs
      - name: Verify weekly import cannot run without review approval
        run: |
          if node scripts/apply-reviewed-sleeper-week.mjs data-integrity/sleeper-sync-candidates/2026-week8.json > /tmp/unapproved-weekly-import.log 2>&1; then
            echo "Unapproved weekly import unexpectedly succeeded"
            exit 1
          fi
          grep -q "Human approval required" /tmp/unapproved-weekly-import.log
      - name: Verify Madden-style manager OVR and evidence-gated attributes
        run: node scripts/verify-manager-madden-cards.mjs
      - name: Verify manager report card evidence
        run: node scripts/verify-manager-report-cards.mjs
      - name: Reconcile FAAB manager-season aggregates (research-only)
        run: node scripts/verify-faab-aggregates.mjs
      - name: Generate research-only FAAB observed acquisition outcomes
        run: node scripts/analyze-faab-acquisition-value.mjs
      - name: Summarize research-only FAAB team-season production
        run: node scripts/summarize-faab-observed-value.mjs
      - name: Compare FAAB starter production to observed bench alternatives
        run: node scripts/analyze-faab-bench-opportunity.mjs
      - name: Reconcile all FAAB outcome research outputs
        run: node scripts/verify-faab-outcomes.mjs
      - name: Attribute FAAB outcomes using verified Sleeper handles
        run: node scripts/attribute-faab-managers.mjs
      - name: Summarize verified FAAB manager production without duplicated spend
        run: node scripts/summarize-faab-managers.mjs
      - name: Compute research-only cost-normalized FAAB metrics
        run: node scripts/analyze-faab-cost-normalized.mjs
      - name: Enforce FAAB cost-evidence grade gate
        run: node scripts/verify-faab-cost-normalized.mjs
      - name: Research opposing-bench positional FAAB baseline
        run: node scripts/analyze-faab-opposing-bench-baseline.mjs
      - name: Validate opposing-bench baseline against acquired starters
        run: node scripts/verify-faab-positional-baseline.mjs
      - name: Upload FAAB acquisition outcome research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faab-observed-acquisition-outcomes
          path: |
            data-integrity/faab-observed-acquisition-outcomes-v1.json
            data-integrity/faab-observed-team-season-summary-v1.json
            data-integrity/faab-bench-relative-opportunity-v1.json
            data-integrity/faab-identity-attribution-v1.json
            data-integrity/faab-manager-observed-production-v1.json
            data-integrity/faab-opposing-bench-baseline-v1.json
            data-integrity/faab-cost-normalized-research-v1.json
          if-no-files-found: warn
      - name: Upload manager lineup source exclusion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineup-source-exclusion-audit
          path: data-integrity/lineup-source-exclusion-audit-2020-2025.json
          if-no-files-found: warn
      - name: Reconcile recovered 2025 historical player-level rosters
        run: node scripts/verify-recovered-2025-rosters.mjs
      - name: Reconcile recovered 2024 historical player-level rosters
        run: node scripts/verify-recovered-2024-rosters.mjs
      - name: Reconcile recovered 2023 historical player-level rosters
        run: node scripts/verify-recovered-2023-rosters.mjs
      - name: Reconcile recovered 2022 historical player-level rosters
        run: node scripts/verify-recovered-2022-rosters.mjs
      - name: Reconcile recovered 2021 historical player-level rosters
        run: node scripts/verify-recovered-2021-rosters.mjs
      - name: Reconcile recovered 2020 historical player-level rosters
        run: node scripts/verify-recovered-2020-rosters.mjs
      - name: Audit all six Sleeper seasons for weekly roster completeness
        run: node scripts/audit-six-season-roster-coverage.mjs
      - name: Audit original and recovered ESPN/Sleeper data provenance
        run: node scripts/audit-evidence-coverage.mjs
      - name: Reconcile current 2026 weekly roster evidence
        run: node scripts/verify-recovered-2026-rosters.mjs
      - name: Verify 2026 Scott score parity across canonical projections
        run: node scripts/verify-scott-2026-week7-parity.mjs
      - name: Verify every weekly matchup mirror against canonical ledger
        run: node scripts/verify-weekly-ledger-parity.mjs
      - name: Research-only six-season hindsight lineup analysis
        run: node scripts/analyze-six-season-lineups.mjs
      - name: Run recovered 2025 research-only lineup analysis
        run: node scripts/analyze-recovered-2025-lineups.mjs
      - name: Install browser test runtime
        if: success() || failure()
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise desktop and mobile Chromium pages
        if: success() || failure()
        run: node scripts/test-browser-release.mjs
      - name: Exercise Safari-engine WebKit mobile pages
        if: success() || failure()
        run: FELLAS_BROWSER=webkit node scripts/test-browser-release.mjs
      - name: Verify both browser reports completed
        if: success() || failure()
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const [engine,visits] of [["chromium",164],["webkit",82]]) {
              const file="data-integrity/browser-release-"+engine+".json";
              if(!fs.existsSync(file)) throw Error("Missing browser report: "+file);
              const report=JSON.parse(fs.readFileSync(file,"utf8"));
              if(report.engine.toLowerCase()!==engine || report.plannedPageVisits!==visits || report.completedPages!==visits || report.attemptedPages!==visits || report.passed!==true || report.errors.length)
                throw Error("Incomplete or failed browser report: "+file+" "+JSON.stringify(report));
              console.log(engine+": "+visits+" visits verified");
            }
          '
      - name: Upload browser release verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-reports
          path: data-integrity/browser-release-*.json
          if-no-files-found: ignore
      - name: Release-readiness summary
        if: always()
        run: |
          echo '### Fellas OS release gate' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job checks generated records, historical reconciliation, public consumer bindings, source syntax, and archived record fallbacks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A green result is necessary but **not sufficient** for launch: mobile browser verification, live data fetching, navigation, and full editorial audit remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
