name: Hall of Shame editorial and mobile integrity
on:
  pull_request:
    paths:
      - 'hall/shame.html'
      - 'scripts/test-hall-shame-editorial.mjs'
      - '.github/workflows/hall-shame-editorial.yml'
  push:
    branches: [main]
    paths:
      - 'hall/shame.html'
      - 'scripts/test-hall-shame-editorial.mjs'
  workflow_dispatch:
jobs:
  verify-editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check archive structure and text
        run: node scripts/test-hall-shame-editorial.mjs
