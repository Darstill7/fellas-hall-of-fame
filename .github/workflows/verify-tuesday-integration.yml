name: Verify Tuesday approval and release-health integration
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-approved-weekly-release.yml'
      - '.github/workflows/prepare-approved-trade-museum.yml'
      - '.github/workflows/verify-tuesday-integration.yml'
      - '.github/workflows/rehearse-weekly-release.yml'
      - 'scripts/test-approved-staging-pin.mjs'
      - 'scripts/test-trade-staging-pin.mjs'
      - 'scripts/test-site-freshness.mjs'
      - 'scripts/test-release-health-report.mjs'
      - 'docs/WEEKLY_PUBLICATION.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehearse merge into current main without changing refs or canonical files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA=$(git merge-base "$MAIN_SHA" "$HEAD_SHA")
          echo "Main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Integration: $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Merge base: $BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          # A virtual merge-tree writes no checkout, branch, commit or deployment.
          # A conflict fails this workflow rather than silently claiming readiness.
          if ! MERGED_TREE=$(git merge-tree --write-tree "$MAIN_SHA" "$HEAD_SHA" 2>&1); then
            echo "::error::Current main has conflicts with the integrated release stack"
            echo 'Merge rehearsal: CONFLICT; rebase/reconcile before any release' >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$MERGED_TREE"
            exit 1
          fi
          if ! [[ "$MERGED_TREE" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Virtual merge did not yield a tree hash"
            printf '%s\n' "$MERGED_TREE"
            exit 1
          fi
          echo "Read-only merge rehearsal PASS (tree $MERGED_TREE). Browser, canonical and Pages checks remain separately required." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only approval and freshness test syntax
        run: |
          node --check scripts/test-approved-staging-pin.mjs
          node --check scripts/test-trade-staging-pin.mjs
          node --check scripts/test-site-freshness.mjs
          node --check scripts/test-release-health-report.mjs
      - name: Test reviewed score and trade staging pins
        run: |
          node scripts/test-approved-staging-pin.mjs
          node scripts/test-trade-staging-pin.mjs
      - name: Test website freshness and deliberate stale-source rejection
        run: node scripts/test-site-freshness.mjs
      - name: Test release-health aggregation and unverified-deployment cases
        run: node scripts/test-release-health-report.mjs
