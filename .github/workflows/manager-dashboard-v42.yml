name: Manager Dashboard 4.2 verification
on:
  pull_request:
    paths:
      - 'assets/manager-dashboard-v42.*'
      - 'scripts/test-manager-dashboard-v42*.mjs'
      - '.github/workflows/manager-dashboard-v42.yml'
permissions:
  contents: read
jobs:
  statistics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-manager-dashboard-v42.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: node scripts/test-manager-dashboard-v42-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-dashboard-v42-evidence
          path: data-integrity/manager-dashboard-v42/
