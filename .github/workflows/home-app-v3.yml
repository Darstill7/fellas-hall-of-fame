name: App homepage preview validation
on:
  pull_request:
    paths:
      - 'home-app-preview.html'
      - 'assets/home-app-v3.*'
      - 'assets/weekly-record-watch.mjs'
      - 'data/weekly-record-ownership-v57.json'
      - 'assets/conditional-record-watch-v51.mjs'
      - 'scripts/test-conditional-record-watch-v51.mjs'
      - 'data/conditional-record-watch-v51.json'
      - 'assets/app-shell-v34.*'
      - 'assets/fellas-app-icon.svg'
      - 'fellas-app-preview.webmanifest'
      - 'scripts/test-home-app-v3*'
      - 'scripts/build-home-current-season.mjs'
      - 'data/home-current-season-v1.json'
      - 'data/season_guide.json'
      - 'data/unified_record_book_2016_2026.json'
      - '.github/workflows/home-app-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-home-current-season.mjs --check
      - run: node scripts/test-home-app-v3.mjs
      - run: node scripts/test-conditional-record-watch-v51.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/test-home-app-v3-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-app-v3-preview
          path: data-integrity/home-app-v3/
