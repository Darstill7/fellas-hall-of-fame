<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Player Archive Preview | The Fellas</title><style>
:root{color-scheme:dark;--bg:#0a141e;--panel:#142837;--border:#3b5667;--gold:#e8c47d;--text:#f6f2e9;--muted:#c0d0da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:20px 16px 60px}a{color:var(--gold)}h1{font-size:clamp(28px,6vw,42px);line-height:1.1}h2{font-size:22px}p,small{color:var(--muted)}label{display:block;font-weight:700;margin:12px 0 4px}input,select,button{font:inherit;min-height:46px;padding:10px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:9px}input,select{width:100%}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.filters,.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow-wrap:anywhere}.stat{padding:12px;background:var(--panel);border-radius:10px}.stat strong{display:block;font-size:24px;color:var(--gold)}details{border-bottom:1px solid var(--border);padding:12px 0}summary{cursor:pointer;min-height:44px;font-weight:700}#status{min-height:24px} [hidden]{display:none!important} @media(max-width:360px){.filters{grid-template-columns:1fr}}
</style></head><body><main><a href="record-holders.html">← Record Book</a><p>THE FELLAS · RESEARCH PREVIEW</p><h1>NFL Player Archive</h1><p>Observed Sleeper starter history only. Missing weeks, ESPN performances and unverified ownership are excluded. Candidate records are not certified.</p><section id="directory"><label for="search">Find a player</label><input id="search" type="search" placeholder="Search player name" autocomplete="off"><div class="filters"><div><label for="position">Position</label><select id="position"><option value="">All positions</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>DEF</option></select></div><div><label for="sort">Sort by</label><select id="sort"><option value="points">Starter points</option><option value="starts">Starts</option><option value="name">Name</option></select></div></div><p id="count" aria-live="polite"></p><div id="results"></div><button id="more" hidden>Show more players</button></section><section id="profile" hidden></section><p id="status" role="status"></p></main><script type="module" src="../assets/player-directory-preview.mjs"></script></body></html>
