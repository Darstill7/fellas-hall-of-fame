<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Front Office 3.0 | The Fellas Candidate</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#141b25;--muted:#b6c0cc;--gold:#eed18a;--line:#344050}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f6f5ef;font:15px/1.5 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:24px 16px 60px}h1{font-size:clamp(42px,8vw,76px);line-height:1;letter-spacing:-.055em;margin:14px 0}h2{font-size:26px}p{color:var(--muted)}.kicker{color:var(--gold);font-size:12px;letter-spacing:.13em;font-weight:800}.notice,.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{margin:0}.stat strong{display:block;font-size:27px;color:var(--gold)}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}button{cursor:pointer}button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}input{width:100%}.entry{padding:12px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.entry strong{color:var(--gold)}small{color:var(--muted)}.value{font-variant-numeric:tabular-nums}#more{margin-top:14px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><main><div class="kicker">THE FELLAS / RESEARCH RELEASE CANDIDATE</div><h1>Front Office</h1><p>Roster construction. Franchise intelligence. The history behind every move.</p><section class="notice" id="coverage" role="status">Loading verified candidate data…</section><div id="stats" class="grid"></div><nav aria-label="Front Office departments" id="nav"></nav><section class="panel"><h2 id="heading">Overview</h2><label for="filter">Search players, managers or seasons</label><input id="filter" type="search" placeholder="Search this department" disabled><p id="method"></p><div id="evidence" class="notice" hidden></div><div id="results"></div><button id="more" hidden>Show more</button></section><footer><small>Research candidate only. No public release. Strict starter production is not a causal trade or draft grade.</small></footer></main>
<script type="module">
const root='./historical-trade-draft-audits/front-office-site-candidate/';
const labels={trading:'Trading Floor',draft:'Draft Room',acquisitions:'Acquisition Hall',players:'Player Encyclopedia',managers:'Manager Résumés',keepers:'Keeper Analysis'};
const $=id=>document.getElementById(id), fmt=n=>Number(n).toLocaleString('en-US'), pf=n=>fmt((Number(n)||0)/100);
let manifest,overview,active='overview',rows=[],limit=30,generation=0;
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function load(name){const entry=manifest?.files.find(x=>x.name===name+'.json');if(!entry)throw Error('Missing manifest entry');const r=await fetch(root+entry.name,{cache:'no-store'});if(!r.ok)throw Error('Missing department data');const raw=await r.arrayBuffer();const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',raw)),b=>b.toString(16).padStart(2,'0')).join('');if(hash!==entry.sha256)throw Error('Data checksum mismatch');const d=JSON.parse(new TextDecoder().decode(raw));if(d.status!=='RESEARCH_ONLY_NOT_DEPLOYABLE'||d.completedThrough.year!==manifest.completedThrough.year||d.completedThrough.week!==manifest.completedThrough.week)throw Error('Mixed release cutoff');return d}
function row(title,detail,search=''){return{title,detail,search}}
function render(){const q=$('filter').value.toLowerCase().trim(),matches=rows.filter(r=>(r.title+' '+r.detail+' '+r.search).toLowerCase().includes(q));$('results').replaceChildren(...matches.slice(0,limit).map(r=>{const e=el('div','','entry');e.append(el('strong',r.title),el('div',r.detail));return e}));if(!matches.length)$('results').append(el('p','No matching results.'));$('more').hidden=matches.length<=limit}
async function select(key){const ticket=++generation;active=key;limit=30;$('filter').value='';$('filter').disabled=true;$('heading').textContent=labels[key]||'Overview';$('results').replaceChildren(el('p','Loading…'));for(const b of $('nav').children)b.setAttribute('aria-pressed',String(b.dataset.key===key));try{const d=await load(key);if(ticket!==generation)return;const points=x=>pf(x.regular_pf_cents)+' strict PF · '+fmt(x.regular_starts)+' starts';
const supported=d.supportedEvidence;
const detail=x=>pf(x.supported_pf_cents)+' supported PF · '+fmt(x.supported_starts)+' starts · '+pf(x.strict_pf_cents)+' strict PF · '+fmt(x.additional_starts)+' additional starts';
const ev=$('evidence');ev.hidden=!supported;ev.replaceChildren();
if(supported){ev.append(el('strong','Evidence-supported career production'),el('p',fmt(supported.coverage.supported_starts)+' supported starts · '+fmt(supported.coverage.strict_starts)+' strict starts · '+fmt(supported.coverage.additional_starts)+' additional starts'),el('small',supported.historicalPackage.approved?'Approved historical fingerprint':'Historical package review pending approval. Supported timing does not establish actual lineup-lock logs.'));}
switch(key){
case 'trading':rows=supported?Object.entries(supported.tradeSides).map(([k,v])=>{const [year,id,manager]=JSON.parse(k);return row(manager+' · '+year+' trade',detail(v),id)}):d.pairwise.map(x=>row(x.a+' / '+x.b,Object.entries(x).filter(([k,v])=>!['a','b'].includes(k)&&typeof v==='number').map(([k,v])=>k.replaceAll('_',' ')+': '+fmt(v)).join(' · '),'career trade comparison'));break;
case 'draft':rows=[...Object.entries(supported?.rounds||{}).map(([round,v])=>row('Round '+round+' · career production',detail(v))),...(supported?.picks||d.picks).map(x=>row((x.name||x.player_id)+' · '+x.manager,x.year+' · Round '+(x.cost?.round??'unknown')+' · '+(supported?.picks?detail(x):points(x)),x.category))];break;
case 'acquisitions':rows=supported?[...Object.entries(supported.categories).map(([name,v])=>row(name+' · category total',detail(v))),...(supported.rankings||[]).map(x=>row((x.name||x.player_id)+' · '+x.manager,x.year+' · '+x.category+' · '+detail(x)))]:Object.entries(d.rankings).flatMap(([k,v])=>v.map(x=>row((x.name||x.player_id)+' · '+x.manager,k+' · '+x.year+' · '+points(x))));break;
case 'players':rows=d.players.map(x=>row(x.name||x.player_id,(supported?.players[String(x.player_id)]?detail(supported.players[String(x.player_id)]):pf(x.totals.pf_cents)+' strict PF · '+fmt(x.totals.starts)+' starts')+' · '+x.ownership.map(o=>o.manager+' '+o.year).join(', ')));break;
case 'managers':rows=supported?Object.entries(supported.managers).sort((a,b)=>b[1].supported_pf_cents-a[1].supported_pf_cents).map(([name,v])=>row(name,detail(v))):d.managers.flatMap(x=>Object.entries(x.categories).map(([k,v])=>row(x.manager+' · '+k,fmt(v.acquisitions)+' acquisitions · '+pf(v.pf_cents)+' PF · '+fmt(v.starts)+' starts')));break;
case 'keepers':rows=[...(supported?.archiveKeeperTotals?[row('Archive keeper production',detail(supported.archiveKeeperTotals))]:[]),...(supported?.unknownKeeperTotals?[row('Unknown keeper status production',detail(supported.unknownKeeperTotals))]:[]),...[...d.keepers,...d.unknown].map(x=>row((x.name||x.player_id)+' · '+x.manager,x.year+' · '+x.category+' · '+points(x)))];break;
default:rows=Object.entries(labels).map(([k,v])=>row(v,'Select '+v+' in the department navigation.'))}
$('method').textContent=d.method+' '+(d.limitations||[]).join(' ');$('filter').disabled=false;render()}catch(e){if(ticket===generation){rows=[];$('results').replaceChildren(el('p','Cannot load department: '+e.message));$('more').hidden=true}}}
$('filter').addEventListener('input',()=>{limit=30;render()});$('more').addEventListener('click',()=>{limit+=30;render()});
try{const r=await fetch(root+'manifest.json',{cache:'no-store'});if(!r.ok)throw Error('Candidate not generated');manifest=await r.json();if(manifest.status!=='RESEARCH_ONLY_NOT_DEPLOYABLE'||manifest.files.length!==7)throw Error('Invalid candidate manifest');overview=await load('overview');const c=overview.coverage;$('coverage').textContent='Historical Sleeper coverage: 2020–2025 · '+manifest.completedThrough.year+' through Week '+manifest.completedThrough.week+' · Trade deadline Week '+overview.tradeDeadline.week+' · '+overview.tradeDeadline.status;for(const [label,value] of [['Historical acquisitions',c.historical_acquisitions],['Live acquisitions',c.live_acquisitions],['Strict regular starts',c.regular_starts],['Unattributed live starts',c.live_unattributed_starts]]){const e=el('div','','stat');e.append(el('strong',fmt(value)),el('small',label));$('stats').append(e)}for(const [key,label] of Object.entries({overview:'Overview',...labels})){const b=el('button',label);b.dataset.key=key;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>select(key));$('nav').append(b)}await select('overview')}catch(e){$('coverage').textContent='Candidate unavailable: '+e.message}
</script></body></html>
